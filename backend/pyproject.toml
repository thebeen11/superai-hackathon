[project]
name = "hedge-fund-council-backend"
version = "0.1.0"
description = "Backend for the Hedge Fund AI Agent Council"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "python-dotenv==1.0.1",
    "exa-py==1.8.7",
    "youtube-transcript-api==0.6.3",
    "google-api-python-client==2.157.0",
    "sqlalchemy>=2.0.50",
    "psycopg[binary]>=3.3.4",
    "alembic>=1.18.4",
    "google-genai>=2.8.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
